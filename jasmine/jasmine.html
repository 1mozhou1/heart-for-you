<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>茉莉花开</title>
    <style>
        body { background-color: #f5f5f5; }
    </style>
</head>
<body>
    <canvas id="myCanvas" width="400" height="400"></canvas>
    <script>
        var canvas = document.getElementById('myCanvas');
        var ctx = canvas.getContext('2d');

        var totalFrames = 4;
        var frameInterval = 100;
        var currentFrame = 0;
        var frames = [];
        var loadedCount = 0;

        // 加载所有图片
        for (var i = 1; i <= totalFrames; i++) {
            var img = new Image();
            img.onload = function() {
                loadedCount++;
                // 每加载完一张，就检查一次是否全部就绪
                if (loadedCount === totalFrames) {
                    startAnimation();
                }
            };
            img.onerror = function() {
                console.error('图片加载失败: ' + this.src);
            };
            img.src = 'flower_' + i + '.png';
            frames.push(img);
        }

        // 图片全部加载完毕后，才开始播放动画
        function startAnimation() {
            playFrame();
        }

        function playFrame() {
            ctx.clearRect(0, 0, 400, 400);
            ctx.drawImage(frames[currentFrame], 0, 0, 400, 400);
            currentFrame = (currentFrame + 1) % totalFrames;
            setTimeout(playFrame, frameInterval);
        }
    </script>
</body>
</html>
